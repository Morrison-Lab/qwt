# Claude Code GitHub Action (agent mode) -- thin caller.
#
# Responds to "@claude" mentions in issues, issue comments, PR review
# comments, and PR reviews. Requires the CLAUDE_CODE_OAUTH_TOKEN secret.
#
# The reusable workflow in Morrison-Lab/gha now owns everything this file
# used to hand-roll: branch setup + draft-PR opening for issue triggers,
# posting Claude's prose reply when no code was committed, dispatching
# claude-code-review.yml on an explicit "@claude review" (including one
# absorbed late by the polling loop), and the late-comment dedup / rescue
# machinery (`<!-- claude-absorbed: ... -->` marker + 🚀 reaction) that was
# originally ported FROM this repo's own #73/#90/#95 into gha's claude.yml.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.
#
# Secrets are passed explicitly rather than via `secrets: inherit`: GitHub
# only inherits secrets into a reusable workflow owned by the same org/user,
# and Morrison-Lab/gha is a different owner than this repo.
#
# Project guidance for Claude lives in CLAUDE.md at the repo root.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # `assigned` is intentionally NOT triggered: the actor-gate below checks
    # `github.event.issue.author_association`, which describes the issue
    # *author* -- not the assigner. A collaborator assigning themselves to an
    # outsider's issue would fail the gate. If you need a collaborator to
    # invoke @claude on an outsider's issue, leave a comment instead.
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Cheap caller-side gate: only invoke the reusable workflow when an
    # @claude mention is present AND the author is trusted
    # (OWNER/MEMBER/COLLABORATOR), so an untrusted commenter's mention
    # doesn't even spawn the reusable-workflow run. This mirrors the reusable
    # workflow's own trusted-author gate as defense-in-depth.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    permissions:
      contents: write       # so Claude can push a branch
      pull-requests: write  # so Claude can open / edit PRs
      issues: write         # so Claude can comment on issues
      id-token: write
      actions: write        # dispatch claude-code-review.yml via `gh workflow run`
    uses: Morrison-Lab/gha/.github/workflows/claude.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Max-plan OAuth; empty when using API key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # direct API key; empty when using OAuth
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}   # optional; latex-macros/ is public, so unset is fine
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}       # optional; for editing .github/workflows
    with:
      install-quarto: true      # qwt is a Quarto site; Claude may need to render .qmd files
      checkout-submodules: true # latex-macros/ (public; no SUBMODULES_TOKEN needed)
