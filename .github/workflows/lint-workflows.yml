# Thin caller of Morrison-Lab/gha's reusable workflow linter: actionlint
# (syntax, expression semantics, shellcheck over `run:` blocks) plus zizmor
# (security).
#
# Blocking: both tools report zero findings against this repo as of this
# workflow's introduction, so a new finding means a new problem rather than a
# pre-existing backlog.
#
# Two things keep it that way. `.github/zizmor.yml` sets the `unpinned-uses`
# policy to `ref-pin`, because this repo pins actions to tags on purpose and
# lets dependabot keep them current -- while still flagging a branch pin such
# as `@HEAD`, which is outside every safety net we have. And genuine false
# positives carry an inline `# zizmor: ignore[...]` or
# `# shellcheck disable=...` with the reason written next to it, so a reader
# can disagree with each one individually.
name: Lint Workflows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # The repo default is write, so declare the read-only scope this
    # reusable workflow's own job asks for rather than inheriting it.
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/lint-workflows.yml@v2
