# Thin caller of Morrison-Lab/gha's reusable semantic-line-break check.
#
# The lab convention is one source line per major phrase in prose. This check
# is diff-scoped -- it looks only at lines a PR adds -- so it needs no reflow
# pass over existing text. On `push` there is no base to diff against, so the
# reusable workflow skips the scan.
name: Check new markdown lines for missing semantic breaks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # The repo default is write, so declare the read-only scope this
    # reusable workflow's own job asks for rather than inheriting it.
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-new-line-breaks.yml@v2
    with:
      # Space-separated git pathspecs. The upstream default is `*.md` alone;
      # this site's prose lives in `.qmd`.
      globs: '*.md *.qmd'
      # `_extensions/` is vendored third-party code (do not modify),
      # and `latex-macros/` is a submodule owned by Morrison-Lab/macros.
      paths-ignore: '_extensions/**,latex-macros/**'
